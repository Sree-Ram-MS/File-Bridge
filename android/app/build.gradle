plugins {
    id 'com.android.application'
}

def coreVersion = { ->
    def m = (file('../../filebridge.py').text =~ /VERSION\s*=\s*"([^"]+)"/)
    return m.find() ? m.group(1) : '0.1.0'
}()

android {
    namespace 'com.sreeram.filebridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sreeram.filebridge'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName coreVersion
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so the APK installs directly (sideloading).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
