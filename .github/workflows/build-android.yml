name: Build Android APK
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare project
        run: |
          python3 tools/export_web.py
          pip install pillow
          cd flutter_app
          flutter create --org com.sreeram --project-name filebridge --platforms android . 2>&1 | tee -a $GITHUB_WORKSPACE/build.log
          rm -rf test
          python3 tool/setup_android.py | tee -a $GITHUB_WORKSPACE/build.log
          flutter pub get 2>&1 | tee -a $GITHUB_WORKSPACE/build.log
          echo "VER=$(python3 -c 'import sys;sys.path.insert(0,"..");import filebridge;print(filebridge.VERSION)')" >> $GITHUB_ENV
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a $GITHUB_WORKSPACE/build.log
      - name: Build APK
        working-directory: flutter_app
        run: |
          flutter build apk --release 2>&1 | tee -a $GITHUB_WORKSPACE/build.log
          mkdir -p $GITHUB_WORKSPACE/dist
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/dist/FileBridge-${{ env.VER }}-android.apk
          ls -la $GITHUB_WORKSPACE/dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: dist/FileBridge-${{ env.VER }}-android.apk
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -n -i -E "error|exception|failed|what went wrong" build.log | tail -n 80; echo '```'; echo; echo '<details><summary>Log tail</summary>'; echo; echo '```'; tail -n 150 build.log; echo '```'; echo '</details>'; } > report.md || echo "no log" > report.md
          gh issue create --repo "${{ github.repository }}" --title "Android build failed (${GITHUB_SHA::7})" --body-file report.md --label ci-failure || gh issue create --repo "${{ github.repository }}" --title "Android build failed (${GITHUB_SHA::7})" --body-file report.md
