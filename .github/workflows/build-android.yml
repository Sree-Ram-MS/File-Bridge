name: Build Android APK
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Export web UI
        run: |
          python3 tools/export_web.py
          echo "VER=$(python3 -c 'import filebridge;print(filebridge.VERSION)')" >> $GITHUB_ENV
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/FileBridge-${VER}-android.apk
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: dist/FileBridge-${{ env.VER }}-android.apk
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -n -E "error:|ERROR|FAILURE|What went wrong|Exception" build.log | head -n 60; echo '```'; echo; echo '<details><summary>Log tail</summary>'; echo; echo '```'; tail -n 120 build.log; echo '```'; echo '</details>'; } > report.md 2>/dev/null || echo "no log" > report.md
          gh issue create --repo "${{ github.repository }}" --title "Android build failed (${GITHUB_SHA::7})" --body-file report.md
