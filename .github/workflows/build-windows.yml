name: Build Windows exe
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python tests/test_api.py
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --console --name FileBridge --icon assets\icon.ico --version-file packaging\windows\version_info.txt filebridge.py
      - name: Rename
        shell: pwsh
        run: |
          $ver = (python -c "import filebridge;print(filebridge.VERSION)").Trim()
          Move-Item -Path "dist\FileBridge.exe" -Destination "dist\FileBridge-$ver-windows-x64.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "VER=$ver"
          Get-ChildItem dist
      - name: Smoke test
        shell: pwsh
        run: |
          & ".\dist\FileBridge-$env:VER-windows-x64.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: dist/FileBridge-${{ env.VER }}-windows-x64.exe
