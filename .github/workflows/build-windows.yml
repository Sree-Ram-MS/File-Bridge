name: Build Windows exe
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python tests/test_api.py
      - name: Build exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --onefile --console --name FileBridge --icon assets\icon.ico --version-file packaging\windows\version_info.txt filebridge.py
          $ver = python -c "import filebridge;print(filebridge.VERSION)"
          Rename-Item dist\FileBridge.exe "FileBridge-$ver-windows-x64.exe"
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          dist\FileBridge-$ver-windows-x64.exe --version
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: dist/FileBridge-${{ env.VER }}-windows-x64.exe
